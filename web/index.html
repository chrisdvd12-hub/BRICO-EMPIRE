<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#006c82"><title>Brico Empire · Cartoon</title><link rel="icon" href="game.icon.png"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#043b60;color:white;font:16px system-ui,sans-serif}body{display:grid;place-items:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);overflow:hidden;overscroll-behavior:none;touch-action:none}.game{aspect-ratio:9/16;height:auto;width:min(100%,calc((100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom))*9/16));position:relative}iframe{border:0;width:100%;height:100%;display:block;background:#006c82}.notice{position:absolute;inset:0;background:#043b60 url('loading-c.webp') center/cover no-repeat;z-index:2}.notice[hidden]{display:none}.progress-area{position:absolute;left:8%;right:8%;bottom:3%;text-align:center}.progress-area p{margin:8px 0;font-weight:700;font-size:15px}progress{width:100%;height:20px;border:3px solid white;border-radius:12px;background:#06466d;appearance:none;-webkit-appearance:none;overflow:hidden}progress::-webkit-progress-bar{background:#06466d}progress::-webkit-progress-value{background:#ff941c;border-radius:8px}progress::-moz-progress-bar{background:#ff941c;border-radius:8px}#retry{color:white;background:#006c82;border:2px solid white;border-radius:12px;padding:12px 20px;font:inherit;cursor:pointer}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style></head><body><main class="game" aria-label="Brico Empire, jeu de gestion"><div class="notice" id="notice" role="status" aria-live="polite"><h1 class="sr-only">BRICO EMPIRE</h1><div class="progress-area"><progress id="progress" aria-label="Chargement du jeu"></progress><p id="loading-text">Ouverture de votre magasin…</p><button id="retry" hidden>Réessayer</button><noscript>Activez JavaScript pour lancer le jeu.</noscript></div></div><iframe id="game" src="game.html" title="Brico Empire" allow="autoplay; fullscreen; gamepad"></iframe></main><script>
const frame=document.getElementById('game'),notice=document.getElementById('notice'),progress=document.getElementById('progress'),label=document.getElementById('loading-text'),retry=document.getElementById('retry');
retry.onclick=()=>location.reload();
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.origin!==location.origin)return;const m=event.data;if(!m||typeof m!=='object')return;if(m.type==='brico-ready'){notice.hidden=true;frame.focus()}else if(m.type==='brico-progress'&&m.total>0){progress.max=m.total;progress.value=m.current;label.textContent=m.current>=m.total?'Préparation du magasin…':`Chargement du jeu · ${Math.min(99,Math.floor(m.current/m.total*100))} %`}else if(m.type==='brico-error'){label.textContent='Le chargement a échoué. Vérifie ta connexion.';retry.hidden=false}});
setTimeout(()=>{if(!notice.hidden){label.textContent='Le premier chargement peut prendre un peu de temps…';retry.hidden=false}},45000);
</script></body></html>
